services:
  api:
    build: ./backend
    ports:
      - "5113:8080"
    environment:
      # The SQLite file lives on the api-data volume so it survives rebuilds.
      Database__Path: /app/data/skyroute.db
      UseFakes: ${UseFakes:-true}
      # Real integrations (UseFakes=false) read these; Fakes ignore them.
      Renaper__BaseUrl: ${Renaper__BaseUrl:-https://api-openrenaper.matiasagustinibanez.com}
      Padi__ApiKey: ${Padi__ApiKey:-}
      Padi__BaseUrl: ${Padi__BaseUrl:-https://padi.runasp.net}
      Weather__MaxWindSpeedKmh: ${Weather__MaxWindSpeedKmh:-30}
      Weather__MaxPrecipitationMm: ${Weather__MaxPrecipitationMm:-0}
    volumes:
      - api-data:/app/data

  web:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly: use the host address, not the service name.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:5113}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
