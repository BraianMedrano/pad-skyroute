services:
  api:
    build: ./backend
    ports:
      - "5113:8080"
    environment:
      ConnectionStrings__SkyRoute: "Data Source=/app/data/skyroute.db"
    volumes:
      - api-data:/app/data

  web:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly: use the host address, not the service name.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:5113}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
